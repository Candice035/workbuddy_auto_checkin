name: Buddy 加油站每日自动化

# 相对原版的改动：
#   1. 新增「网络探测」步骤：打印 runner 出口 IP、系统 DNS 解析结果、DoH 解析结果，
#      不做任何修改，只用于判断 copilot.tencent.com 被调度到了哪个节点。
#   2. 第一次执行失败（exit != 0）时，自动把域名钉到境内边缘 IP 重跑一次。
#      原因：该域名 CNAME 到腾讯云加速域名，境外 runner 容易被调度到国际节点，
#      而接口只在境内边缘提供服务，表现为「快速失败」。钉境内 IP 可以绕开。
#   3. 关键日志（HTTP -1 / 4xx / 5xx / 飞书返回 / 结论）自动抓进 step summary。
#   4. 失败时真实返回非 0，页面标红（原版恒 exit 0，坏了也显示绿色）。
#      想恢复原版"永不标红"，把最后一个步骤的 exit "$code" 改成 exit 0。
#   5. job 超时 10 → 15 分钟（失败重跑会多花一轮时间）。

on:
  schedule:
    # GitHub 的 cron 是尽力而为：高负载时会延迟，甚至静默丢弃整次运行。
    # 三个时段互为备份，只要有一个跑到，当天就完成了。
    # 脚本幂等：已签过只返回「今日已签过」，名额用完不会重派。
    #
    # 间隔 6 小时是因为猫猫旅行最长 4 小时（travel/config 的
    # duration_hours_max），这样下一轮运行时它必定已经到家，可以领回礼物。
    # 三个点都落在 :10，避开 GitHub 提示的整点高负载期。
    #
    # cron 按 UTC 计时，下面是 UTC，括号内为北京时间（UTC+8）。
    - cron: "10 0 * * *"    # 00:10 UTC = 08:10 北京（主时段）
    - cron: "10 6 * * *"    # 06:10 UTC = 14:10 北京（备份）
    - cron: "10 12 * * *"   # 12:10 UTC = 20:10 北京（备份）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 定位 Python 解释器
        id: py
        # 解释器路径不写死版本号，动态取 runner 上可用的解释器
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "未找到可用的 Python 解释器" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print("使用解释器:", sys.executable, sys.version.split()[0])'
          echo "python_path=$PY" >> "$GITHUB_OUTPUT"

      - name: 网络探测（只读）
        env:
          HOST: copilot.tencent.com
        run: |
          set -uo pipefail
          echo "runner 出口 IP：$(curl -s --max-time 12 https://api.ipify.org || echo 取不到)"
          echo "系统 DNS 解析："
          getent hosts "$HOST" || echo "  （解析失败）"
          echo "DoH 解析（doh.pub）："
          curl -s --max-time 12 -H 'accept: application/dns-json' \
            "https://doh.pub/dns-query?name=$HOST&type=A" | head -c 400 || echo "  （DoH 不通）"
          echo ""
          curl -sS -o /dev/null -w "直连耗时：http=%{http_code} tcp=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s ip=%{remote_ip}\n" \
            --max-time 25 -X POST \
            -H "Authorization: Bearer ${{ secrets.WB_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" -H "User-Agent: WorkBuddy" \
            -d '{}' "https://$HOST/v2/billing/meter/checkin-activity-status" \
            || echo "直连失败（见上）/ 或超时"

      - name: 执行签到与派猫猫（第一次）
        id: run1
        continue-on-error: true
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WB_ENDPOINT: https://copilot.tencent.com
          WB_RESULT_FILE: ${{ runner.temp }}/wb_result.json
        run: |
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          LOG="$RUNNER_TEMP/wb_run1.log"
          set +e
          "$PY" wb_auto.py 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cp -f "$LOG" "$RUNNER_TEMP/wb_keep.log" 2>/dev/null || true

      - name: 失败兜底：钉境内边缘 IP 后重跑
        id: run2
        # 只在第一次真失败（非 0）时触发；已签到的正常返回 0，不会白跑。
        if: steps.run1.outputs.code != '0'
        continue-on-error: true
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WB_ENDPOINT: https://copilot.tencent.com
          WB_RESULT_FILE: ${{ runner.temp }}/wb_result.json
          HOST: copilot.tencent.com
          FALLBACK_IPS: "61.170.82.63 183.131.191.220"
        run: |
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          LOG="$RUNNER_TEMP/wb_run2.log"

          # 优先用 DoH 当下解析到的 A 记录（可能已换 IP），失败再用固定列表
          ips="$(curl -s --max-time 12 -H 'accept: application/dns-json' \
            "https://doh.pub/dns-query?name=$HOST&type=A" \
            | grep -oE '"data"[[:space:]]*:[[:space:]]*"[0-9]{1,3}(\.[0-9]{1,3}){3}"' \
            | grep -oE '[0-9]{1,3}(\.[0-9]{1,3}){3}' | tr '\n' ' ' || true)"
          [ -z "${ips// /}" ] && ips="$FALLBACK_IPS"

          echo "钉住以下地址：$ips"
          for ip in $ips $FALLBACK_IPS; do
            echo "$ip $HOST" | sudo tee -a /etc/hosts >/dev/null
          done
          echo "写入后解析结果："; getent hosts "$HOST" || true

          set +e
          "$PY" wb_auto.py 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cp -f "$LOG" "$RUNNER_TEMP/wb_keep.log" 2>/dev/null || true

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/wb_result.json
          KEEP_LOG: ${{ runner.temp }}/wb_keep.log
          CODE1: ${{ steps.run1.outputs.code }}
          CODE2: ${{ steps.run2.outputs.code }}
        run: |
          set -uo pipefail
          {
            echo "### Buddy 加油站每日自动化"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')（cron 为 UTC）"
            echo "- 第一次结果：exit=${CODE1:-未执行}"
            if [ -n "${CODE2:-}" ]; then
              echo "- 钉 IP 重跑结果：exit=${CODE2}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f "$KEEP_LOG" ]; then
            {
              echo ""
              echo "### 关键日志"
              echo '```'
              grep -E 'HTTP -1|HTTP (4|5)[0-9][0-9]|\[飞书\]|结论：' "$KEEP_LOG" | head -20 || echo '无匹配行'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # 以最后一次实际执行的结果定成败；想永不标红就改成 exit 0
          final="${CODE2:-${CODE1:-1}}"
          if [ "$final" != "0" ]; then
            echo "::error::本轮存在未完成项，详见上方摘要与日志"
          fi
          exit "$final"
